<!DOCTYPE html>
<html>
<head>
    <title>Login Redirect</title>
</head>
<body>
    <script>
        window.onload = function() {
            var fragment = window.location.hash;
            var url = new URL('https:\/\/app.netlify.com\/edge-access?domain=firstdrive.cz\u0026requested_path=%2F\u0026site_id=2e0596d6-f764-41a5-8b73-3302655c5747');
            if (fragment) {
                var requestedPath = url.searchParams.get('requested_path');
                url.searchParams.set('requested_path', requestedPath + fragment);
            }
            window.location.href = url.toString();
        };
    </script>

    <noscript>
        <p>Please enable JavaScript to continue. This login redirect requires JavaScript.</p>
    </noscript>
</body>
</html>
